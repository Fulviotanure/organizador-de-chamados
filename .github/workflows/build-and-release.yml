name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Automatically Publish All Draft Releases and Set Latest
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "Verificando e garantindo que a release seja publicada como Latest..."
          try {
            $releases = @(gh release list --limit 10 --json tagName,isDraft | ConvertFrom-Json)
            foreach ($rel in $releases) {
              if ($rel.isDraft) {
                Write-Host "Publicando rascunho: $($rel.tagName)"
                gh release edit $rel.tagName --draft=false
              }
            }

            # Garantir que a versao atual seja explicitamente marcada como latest
            $targetTag = $env:GITHUB_REF_NAME
            if (-not $targetTag -or $targetTag -eq 'main') {
              $pkg = Get-Content package.json | ConvertFrom-Json
              $targetTag = "v$($pkg.version)"
            }
            Write-Host "Definindo $targetTag como release Latest no GitHub..."
            gh release edit $targetTag --latest --draft=false
          } catch {
            Write-Host "Aviso ao ajustar releases: $_"
          }
