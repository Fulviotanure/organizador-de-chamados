name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Publish Release to GitHub
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Build Electron App (Check only)
        if: "!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch'"
        run: npm run build

      - name: Automatically Publish All Draft Releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "Verificando se existem releases em rascunho (Draft)..."
          try {
            $releases = @(gh release list --json tagName,isDraft | ConvertFrom-Json)
            foreach ($rel in $releases) {
              if ($rel.isDraft) {
                Write-Host "Publicando rascunho automaticamente: $($rel.tagName)"
                gh release edit $rel.tagName --draft=false --latest
              }
            }
          } catch {
            Write-Host "Aviso ao verificar releases: $_"
          }
